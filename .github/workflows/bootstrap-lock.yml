name: Bootstrap dependency evidence
on:
  push:
    branches: [feat/obsidian-lego-foundation]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve pinned toolchain and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --no-frozen-lockfile
      - name: Normalize candidate only (not a verification of unchanged source)
        run: pnpm exec biome check --write .
      - name: Verify candidate with real SDK
        run: pnpm verify
      - name: Collect candidate and lock without writing Git
        if: always()
        run: |
          mkdir -p artifacts
          git diff --binary > artifacts/candidate.patch
          test ! -f pnpm-lock.yaml || cp pnpm-lock.yaml artifacts/
          test ! -f main.js || cp main.js artifacts/
          cp manifest.json styles.css artifacts/
          node --version > artifacts/toolchain.txt
          pnpm --version >> artifacts/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundation-bootstrap-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
