name: Headless tooling bootstrap
on:
  push:
    branches: ['headless/01-core-and-doctor']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: |
          mkdir -p artifacts/tooling
          cp node_modules/.pnpm/@biomejs+cli-linux-x64@2.0.6/node_modules/@biomejs/cli-linux-x64/biome artifacts/tooling/biome
          cd artifacts/tooling
          sha256sum biome > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-formatter
          path: artifacts/tooling/
          retention-days: 1
          if-no-files-found: error
