name: Verify
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned toolchain in disposable runner
        run: npm install --global pnpm@11.25.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types, contract tests and real SDK build
        run: pnpm verify
      - name: Verify no tracked source changed
        run: git diff --exit-code
      - name: Package review artifact (not a release)
        run: |
          mkdir -p artifacts
          cp main.js manifest.json styles.css artifacts/
          cd artifacts
          sha256sum main.js manifest.json styles.css > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nmlb-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
